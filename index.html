<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>travi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&display=swap">
<style>
  :root { --bg: #05060F; --ink: #F4F5FA; --ink-2: #6A6F86; --accent: #7B63FF; --accent-2: #4A2FE0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
  .mark { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 28px; letter-spacing: -0.03em; }
  .mark i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-2) 70%); box-shadow: 0 0 0 6px rgba(123,99,255,0.14), 0 0 40px rgba(123,99,255,0.35); }
  p { position: fixed; bottom: 22px; left: 0; right: 0; text-align: center; margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12px; color: var(--ink-2); letter-spacing: 0.08em; text-transform: uppercase; }
  a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
  <div class="mark"><i></i>travi</div>
  <p>soon · <a href="/privacy">privacy</a></p>
</body>
</html>
